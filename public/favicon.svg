<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
      .logo-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        fill: #ffffff;
      }
    </style>
  </defs>
  <rect width="32" height="32" rx="8" fill="#050505"/>
  <rect width="32" height="32" rx="8" stroke="rgba(255,255,255,0.12)" stroke-width="1" style="mix-blend-mode: overlay;"/>
  
  <!-- "D" centered perfectly using Space Grotesk -->
  <text x="13.5" y="16.5" font-size="18" text-anchor="middle" dominant-baseline="central" class="logo-text">D</text>
  
  <!-- The dot matching the Dev Mate. style -->
  <circle cx="22" cy="21" r="1.75" fill="#ffffff" opacity="0.6" />
</svg>
